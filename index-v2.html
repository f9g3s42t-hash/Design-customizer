<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style-v2.css">
</head>
<body>
    <div class="container">
        <h1>Customize Your Design</h1>
        <input type="text" class="text-input" placeholder="Enter your text here">
